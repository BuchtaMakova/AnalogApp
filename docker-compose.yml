services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: analog_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: analoghub_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage, so photo upload works with zero external accounts. Swap
  # Storage__ServiceUrl for a real Cloudflare R2 / AWS S3 endpoint in an actual production deploy.
  minio:
    image: minio/minio:latest
    container_name: analog_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the photos bucket, then exits. Re-running docker compose up is a no-op if it already exists.
  minio-init:
    image: minio/mc:latest
    container_name: analog_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      (mc mb local/analoghub-photos || true) &&
      exit 0
      "

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: analog_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AnalogHubDb: "Host=postgres;Port=5432;Database=analoghub_db;Username=postgres;Password=postgrespassword"
      # Defaults to the local MinIO container below, so `docker compose up` needs zero config.
      # ServiceUrl is what the API container itself uses to reach it (over the compose network —
      # `host.docker.internal` isn't guaranteed to resolve from the host machine, so it can't be
      # relied on there either). PublicServiceUrl is substituted into presigned URLs handed back to
      # the browser, which can only reach MinIO via its host-published port. See
      # S3FileStorageService.RewriteForBrowser.
      #
      # To use a real bucket (Cloudflare R2, AWS S3) instead, set STORAGE_SERVICE_URL,
      # STORAGE_ACCESS_KEY, STORAGE_SECRET_KEY, STORAGE_BUCKET_NAME and STORAGE_USE_SIGV4=true as
      # environment variables before `docker compose up`, and STORAGE_PUBLIC_SERVICE_URL to an empty
      # string ("") — R2/S3's endpoint is already reachable from both the API and the browser, so no
      # rewrite is needed there. See README "Connecting real object storage".
      Storage__BucketName: ${STORAGE_BUCKET_NAME:-analoghub-photos}
      Storage__Region: ${STORAGE_REGION:-auto}
      Storage__ServiceUrl: ${STORAGE_SERVICE_URL:-http://minio:9000}
      Storage__PublicServiceUrl: ${STORAGE_PUBLIC_SERVICE_URL-http://localhost:9000}
      Storage__AccessKey: ${STORAGE_ACCESS_KEY:-minioadmin}
      Storage__SecretKey: ${STORAGE_SECRET_KEY:-minioadmin123}
      Storage__PublicBaseUrl: ${STORAGE_PUBLIC_BASE_URL:-}
      Storage__UseSignatureVersion4: ${STORAGE_USE_SIGV4:-false}
      # Demo mode by default — zero-config AI on a fresh clone, no API key needed. Set
      # USE_MOCK_AI=false and GEMINI_API_KEY=... for real Gemini vision critique / RAG chat.
      UseMockAi: ${USE_MOCK_AI:-true}
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Gemini__VisionModel: gemini-3.6-flash
      Gemini__ChatModel: gemini-3.6-flash
      Gemini__EmbeddingModel: gemini-embedding-001
      # Demo default so `docker compose up` needs zero config, same as the DB/MinIO passwords above.
      # Override with a real random value (JWT_SECRET env var) for any non-local deployment.
      Jwt__Secret: ${JWT_SECRET:-analoghub-demo-jwt-signing-secret-change-me-for-real-deployments}
      Jwt__Issuer: AnalogHub
      Jwt__Audience: AnalogHub
      Jwt__ExpiryMinutes: 120
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: analog_frontend
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres_data:
  minio_data:
